name: Build Custom Dev APK

on:
  workflow_dispatch:

jobs:
  build-android-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Set up Keystore
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEV_KEYSTORE_BASE64" ]; then
            echo "$DEV_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          else
            keytool -genkeypair -v -keystore android/app/upload-keystore.jks \
              -alias epitakadev -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android123 -keypass android123 \
              -dname "CN=EPitakaDev, OU=Dev, O=Custom, L=LK, ST=WP, C=LK"
          fi
          cat <<EOF > android/key.properties
          storePassword=android123
          keyPassword=android123
          keyAlias=epitakadev
          storeFile=upload-keystore.jks
          EOF

      - name: Download Core DBs
        run: |
          EPITAKA_URL=$(python3 -c "import json;print(json.load(open('assets/translations_manifest.json'))['core']['epitaka']['url'])")
          EN_URL=$(python3 -c "import json;print(json.load(open('assets/translations_manifest.json'))['languages']['en']['versions']['default']['url'])")
          mkdir -p android/packs/core_db/src/main/assets
          find android/packs/core_db/src/main/assets -mindepth 1 ! -name '.gitkeep' -delete
          curl -fL -o /tmp/epitaka.zip "$EPITAKA_URL"
          curl -fL -o /tmp/epitaka_en.zip "$EN_URL"
          unzip -q -o /tmp/epitaka.zip -d /tmp/epitaka_x
          unzip -q -o /tmp/epitaka_en.zip -d /tmp/epitaka_en_x
          find /tmp/epitaka_x -name '*.db' -exec cp {} android/packs/core_db/src/main/assets/ \;
          find /tmp/epitaka_en_x -name '*.db' -exec cp {} android/packs/core_db/src/main/assets/ \;

      - name: Analyze & Build Custom Dev APK
        run: |
          dart analyze lib/features/reader/providers/tts_speak_unit.dart lib/features/settings/providers/tts_provider.dart
          export APP_VERSION="1.2.0-pali-3lang"
          export APP_BUILD_NUMBER="1005"
          dart run tool/gen_app_version.dart || true
          flutter build apk --release --flavor dev --target-platform android-arm64 \
            --build-name="$APP_VERSION" --build-number="$APP_BUILD_NUMBER" \
            --dart-define=APP_VERSION="$APP_VERSION" --dart-define=APP_BUILD_NUMBER="$APP_BUILD_NUMBER"

      - uses: actions/upload-artifact@v4
        with:
          name: epitaka-custom-dev-apk
          path: build/app/outputs/flutter-apk/*dev-release.apk
